{% extends "base_dashboard.html" %}

{% block title %}Dashboard - MisMatch{% endblock %}

{% block content %}
<div class="dashboard-container">

  <!-- Emoji Circle -->
  <div class="emoji-circle">
    <span class="emoji">
      {{ session.avatar if session.avatar else "🙂" }}
    </span>
  </div>

  <!-- Clothing Boxes (in a row) -->
  <div class="clothing-row">
    <!-- TOPS Box -->
    <div class="clothing-section">
      <h3 class="section-label">TOPS</h3>

      <div class="clothing-box-container">
        <!-- left arrow next to Top box -->
        <button class="arrow-btn left" onclick="changeClothing('tops', -1)">◀</button>

        <!-- "?" as a placeholder in the top box -->
        <div class="clothing-box clickable"
             id="tops-box"
             onclick="togglePanel('tops')">
          <span class="placeholder">?</span>
        </div>
        <!-- right arrow next to Top box -->
        <button class="arrow-btn right" onclick="changeClothing('tops', 1)">▶</button>
      </div>

      <!-- FILTER BUTTON -->
      <button class="filter-btn" onclick="togglePanel('tops')">Filter</button>

      <!-- FILTER PANEL -->
      <div class="clothing-panel" id="panel-tops">
        <select onchange="applyColorFilter('tops', this.value)">
          <option value="all">All colors</option>
        </select>

        <div class="clothing-grid" id="grid-tops"></div>
      </div>
    </div>

    <!-- BOTTOMS Box -->
    <div class="clothing-section">
      <h3 class="section-label">BOTTOMS</h3>

      <div class="clothing-box-container">
        <!-- left arrow next to Top box -->
        <button class="arrow-btn left" onclick="changeClothing('bottoms', -1)">◀</button>

        <!-- "?" as a placeholder in the bottoms box -->
        <div class="clothing-box clickable"
             id="bottoms-box"
             onclick="togglePanel('bottoms')">
          <span class="placeholder">?</span>
        </div>

        <!-- right arrow next to Top box -->
        <button class="arrow-btn right" onclick="changeClothing('bottoms', 1)">▶</button>
      </div>

      <!-- FILTER BUTTON -->
      <button class="filter-btn" onclick="togglePanel('bottoms')">Filter</button>

      <!-- FILTER PANEL -->
      <div class="clothing-panel" id="panel-bottoms">
        <select onchange="applyColorFilter('bottoms', this.value)">
          <option value="all">All colors</option>
        </select>

        <div class="clothing-grid" id="grid-bottoms"></div>
      </div>
    </div>

    <!-- FOOTWEAR Box -->
    <div class="clothing-section">
      <h3 class="section-label">FOOTWEAR</h3>

      <div class="clothing-box-container">
        <!-- left arrow next to footwear box -->
        <button class="arrow-btn left" onclick="changeClothing('footwear', -1)">◀</button>

        <!-- "?" as a placeholder in the footwear box -->
        <div class="clothing-box clickable"
             id="footwear-box"
             onclick="togglePanel('footwear')">
          <span class="placeholder">?</span>
        </div>

        <!-- right arrow next to footwear box -->
        <button class="arrow-btn right" onclick="changeClothing('footwear', 1)">▶</button>
      </div>

      <!-- FILTER BUTTON -->
      <button class="filter-btn" onclick="togglePanel('footwear')">Filter</button>

      <!-- FILTER PANEL -->
      <div class="clothing-panel" id="panel-footwear">
        <select onchange="applyColorFilter('footwear', this.value)">
          <option value="all">All colors</option>
        </select>

        <div class="clothing-grid" id="grid-footwear"></div>
      </div>
    </div>
  </div>

  <!-- Buttons (MisMatch, Save Outfit & Upload) -->
  <div class="action-buttons">
    <button class="mismatch-btn" onclick="generateMismatchOutfit()">MisMatch</button>
    <button class="save-btn" onclick="saveOutfit()">Save Outfit</button>
    <button class="upload-btn" onclick="openUploadModal()">📷 Upload</button>
  </div>
</div>

<!-- Upload Modal, allows user to upload their own clothing items -->
<div id="upload-modal" class="modal" style="display: none;">
  <div class="modal-content">

  <!-- close button for modal -->
    <span class="close-btn" onclick="closeUploadModal()">&times;</span>
    <h2>Upload Your Clothing</h2>

    <!-- upload form with file input & category selection -->
    <form id="upload-form" enctype="multipart/form-data">
      <div class="form-group">
        <label>Category:</label>
        <select id="upload-category" required>
          <option value="">Select category...</option>
          <!-- user must select the category of the item  -->
          <option value="top">Top</option>
          <option value="bottom">Bottom</option>
          <option value="footwear">Footwear</option>
        </select>
      </div>

      <!-- file input for uploading images -->
      <div class="form-group">
        <label>Image:</label>
        <!-- only accept PNG, JPG & JPEG formats -->
        <input type="file" id="upload-image" accept="image/png, image/jpeg, image/jpg" required>
      </div>
      <button type="submit" class="save-btn">Upload</button>
    </form>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<!-- Clothing Data from Python -->
<script>
  // make data from flask/python in JavaScript available
  const clothingData = {
    tops: {{ tops | tojson }}, // all tops form db
    bottoms: {{ bottoms | tojson }}, // all bottoms from db
    footwear: {{ footwear | tojson }} // all footwear from db
  };
</script>

<!-- JavaScript File containing interactive features -->
<script src="{{ url_for('static', filename='js/generator.js') }}"></script>
{% endblock %}
