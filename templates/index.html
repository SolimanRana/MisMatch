<!-- requirements
 M3: the user must be able to create an account and login to the application -->

 <!-- index.html extends base.html for consistent layout -->
 {% extends "base.html" %}

<!-- Set page title -->
{% block title %}Login - MisMatch{% endblock %}

<!-- Login form content -->
{% block auth_content %}
<h2>Login</h2>

<!-- display error messag if login fails -->
{% if error %}
  <div class="error-message">
    {{ error }}
  </div>
{% endif %}

<!-- form is handled by auth_controller.py /login route -->
<form class="login-form" method="POST" action="/login">
    <!-- username input field -->
    <label>Username</label>
    <input type="text" name="username" placeholder="Username" required>

    <!--passowrd input field  -->
    <label>Password</label>
    <input type="password" name="password" placeholder="Password" required>

    <!-- login button -->
    <button type="submit">Log in</button>
</form>

<!-- link to registration page for new users -->
<div class="links">
  <a href="/register">Registration</a>
</div>
{% endblock %}
